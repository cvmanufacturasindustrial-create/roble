# Render Blueprint de ROBLE: un Web Service de Node que corre app.js (npm start).
# En Render: New → Blueprint → elegir el repo "roble". El dominio propio se agrega en
# Settings → Custom Domains del servicio.
#
# ⚠️ Nunca escribas llaves aquí (este archivo está en GitHub). Las marcadas con
# `sync: false` se llenan a mano en Render → servicio → Environment.
services:
  - type: web
    name: roble
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: SITIO_URL
        value: https://camisainforoble.com
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
